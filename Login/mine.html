<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Login</title>
<style>
  /* Reset básico: faz padding/border entrarem na largura/altura do elemento,
     em vez de somar por fora (facilita o cálculo do layout) */
  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family: 'Courier New', monospace; /* fonte monoespaçada = visual "pixelado/retro" */
    /* fundo em degradê simulando o céu do print: rosa -> lilás -> azul -> verde-água */
    background: linear-gradient(180deg,#E4A9F0 0%, #C9A9E8 30%, #B7B6E6 55%, #A7D8DC 80%, #9FE6D3 100%);
    overflow-x:hidden; /* evita barra de rolagem horizontal por causa dos blocos nas bordas */
    position:relative; /* necessário para os elementos "position:absolute" se posicionarem em relação ao body */
  }

  img{ image-rendering: pixelated; } /* caso algum dia troque algo por imagem, mantém o visual pixelado */

  /* ===== blocos de grama nos cantos superiores (decoração, como no print) ===== */
  .grass{
    position:absolute; top:0; width:140px; height:140px;
    /* topo verde (grama) + parte de baixo marrom (terra) num único gradiente */
    background: linear-gradient(180deg,#7CB246 0 22px, #8A5A34 22px 100%);
  }
  .grass.left{ left:0; }
  .grass.right{ right:0; }
  .grass::before{
    /* pequena listra clara no topo do bloco de grama, só um detalhe visual */
    content:"";
    position:absolute; inset:0 0 auto 0; height:22px;
    background:
      linear-gradient(90deg, transparent 0 30%, rgba(255,255,255,0.15) 30% 40%, transparent 40% 100%);
  }

  /* bloco de terra solto no canto inferior esquerdo, como no print original */
  .dirt-block{
    position:absolute; bottom:0; left:120px;
    width:140px; height:26px;
    background: linear-gradient(180deg,#7CB246 0 8px, #8A5A34 8px 100%);
  }

  /* pontinhos brancos espalhados pelo céu (efeito "partículas/estrelas") */
  .pixel{
    position:absolute; width:10px; height:10px;
    background: rgba(255,255,255,0.55);
  }

  /* =========================================================
     CENA DE MINERAÇÃO (personagem + bloco de diamante no topo)
     ========================================================= */
  .scene{
    position:relative; /* ponto de referência para os elementos filhos "absolute" */
    width:420px;
    height:220px;
    margin: 10px auto 0; /* centraliza a cena horizontalmente */
  }

  /* --- personagem (Steve simplificado em blocos/divs) --- */
  .character{
    position:absolute;
    left: 60px;
    top: 60px;
    width: 60px;
    height: 100px;
  }
  .char-head{
    width:34px; height:34px;
    background:#D9A066; /* cor de pele */
    border:2px solid #6b4526;
    margin: 0 auto; /* centraliza a cabeça em cima do corpo */
  }
  .char-body{
    width:34px; height:38px;
    background:#4C6FB0; /* camisa azul, clássica do Steve */
    border:2px solid #33477a;
    margin: -2px auto 0; /* encosta no pescoço, sem espaço entre cabeça e corpo */
  }
  .char-legs{
    width:34px; height:22px;
    background:#3B4B8C;
    display:flex; /* divide em duas pernas lado a lado */
    margin: 0 auto;
  }
  .char-legs div{ flex:1; border:2px solid #29346b; } /* cada perna ocupa metade da largura */

  /* --- braço que segura a picareta --- */
  .arm{
    position:absolute;
    top: 34px;
    left: 46px;
    width: 12px;
    height: 34px;
    background:#D9A066;
    border:2px solid #6b4526;
    transform-origin: top center; /* o braço gira a partir do "ombro" (topo), não do centro */
    transform: rotate(-15deg);
    animation: swing 0.9s ease-in-out infinite; /* balanço contínuo enquanto está minerando */
    z-index:3; /* fica por cima do corpo */
  }

  /* animação do braço batendo a picareta: sobe (repouso) -> desce (impacto) -> sobe de novo */
  @keyframes swing{
    0%   { transform: rotate(-15deg); }
    45%  { transform: rotate(-75deg); }
    55%  { transform: rotate(-75deg); } /* pequena pausa no ponto de impacto, dá "peso" ao golpe */
    100% { transform: rotate(-15deg); }
  }

  /* quando o resultado do login já foi decidido, o braço para de balançar */
  .arm.arm-idle{ animation: none; transform: rotate(-15deg); }

  /* --- picareta (cabo + cabeça de ferro) --- */
  .pickaxe{
    position:absolute;
    left: -4px;
    top: 26px;
    width: 46px;
    height: 12px;
    transform-origin: left center;
    transform: rotate(-35deg); /* ângulo fixo em relação ao braço, para parecer empunhada */
  }
  .pick-handle{
    position:absolute;
    left:0; top:4px;
    width: 40px; height: 5px;
    background:#8A5A34; /* cabo de madeira */
  }
  .pick-head{
    position:absolute;
    left: 30px; top: -6px;
    width: 16px; height: 16px;
    background:#B9B9B9; /* cor de ferro/pedra */
    border:2px solid #6e6e6e;
    /* clip-path recorta o quadrado num formato de "ponta de picareta" */
    clip-path: polygon(0% 50%, 40% 0%, 100% 20%, 60% 50%, 100% 80%, 40% 100%);
    transition: opacity 0.15s;
  }

  /* estado "quebrado": some a cabeça original da picareta (os estilhaços entram no lugar via JS) */
  .pick-head.broken{
    opacity:0;
  }

  /* estilhaços da picareta, criados dinamicamente pelo JavaScript quando o login falha */
  .pick-shard{
    position:absolute;
    width:8px; height:8px;
    background:#B9B9B9;
    border:2px solid #6e6e6e;
    opacity:0;
    pointer-events:none; /* não bloqueia cliques nos elementos por baixo */
  }
  .pick-shard.fly{
    animation: shard-fall 0.6s ease-in forwards; /* "forwards" mantém o estado final da animação */
  }
  @keyframes shard-fall{
    0%{ opacity:1; transform: translate(0,0) rotate(0deg); }
    /* --dx é definido no JS (direção aleatória), cada estilhaço cai/voa para um lado diferente */
    100%{ opacity:0; transform: translate(var(--dx), 60px) rotate(200deg); }
  }

  /* --- bloco de diamante que está sendo minerado --- */
  .diamond-block{
    position:absolute;
    right: 60px;
    top: 40px;
    width: 90px;
    height: 90px;
    /* dois "brilhos" radiais claros sobre um azul-diamante de fundo, simulando a textura */
    background:
      radial-gradient(circle at 30% 30%, #7FE0E8 0 18%, transparent 19%),
      radial-gradient(circle at 70% 65%, #7FE0E8 0 15%, transparent 16%),
      #4FC1CE;
    border: 3px solid #2E8B94;
    transition: transform 0.15s, opacity 0.3s;
  }

  /* tremelique constante do bloco, dando a sensação de estar sendo golpeado */
  .diamond-block.shaking{
    animation: shake 0.15s linear infinite;
  }
  @keyframes shake{
    0%,100%{ transform: translate(0,0); }
    25%{ transform: translate(-2px,1px); }
    50%{ transform: translate(2px,-1px); }
    75%{ transform: translate(-1px,-2px); }
  }

  /* camada de "rachaduras" sobreposta ao bloco, com 3 estágios de dano progressivo */
  .crack{
    position:absolute; inset:0; /* cobre o bloco inteiro */
    background-repeat:no-repeat;
    background-position:center;
    background-size:90% 90%;
    opacity:0; /* sem rachadura = invisível */
    pointer-events:none;
  }
  /* cada estágio adiciona mais linhas de rachadura (gradientes finos em diagonal) e aumenta a opacidade */
  .crack.stage-1{ opacity:0.35; background-image: linear-gradient(115deg, transparent 48%, #222 49%, #222 51%, transparent 52%); }
  .crack.stage-2{ opacity:0.55; background-image:
      linear-gradient(115deg, transparent 47%, #111 49%, #111 51%, transparent 53%),
      linear-gradient(25deg, transparent 60%, #111 62%, #111 64%, transparent 66%); }
  .crack.stage-3{ opacity:0.8; background-image:
      linear-gradient(115deg, transparent 45%, #000 49%, #000 51%, transparent 55%),
      linear-gradient(25deg, transparent 58%, #000 62%, #000 64%, transparent 68%),
      linear-gradient(160deg, transparent 65%, #000 68%, #000 70%, transparent 74%); }

  /* estado final do bloco quando o login dá certo: encolhe e desaparece */
  .diamond-block.broken{
    opacity:0;
    transform: scale(0.5);
  }

  /* fragmentos do bloco de diamante, criados dinamicamente pelo JS no momento do sucesso */
  .frag{
    position:absolute;
    width:14px; height:14px;
    background:#4FC1CE;
    border:2px solid #2E8B94;
    opacity:0;
    pointer-events:none;
  }
  .frag.fly{
    animation: frag-fly 0.55s ease-out forwards;
  }
  @keyframes frag-fly{
    0%{ opacity:1; transform: translate(0,0) rotate(0deg) scale(1); }
    /* --fx e --fy são definidos no JS: cada fragmento voa numa direção/distância aleatória */
    100%{ opacity:0; transform: translate(var(--fx), var(--fy)) rotate(280deg) scale(0.4); }
  }

  /* mensagem de status (sucesso/erro) abaixo da cena de mineração */
  .status-msg{
    text-align:center;
    min-height: 20px; /* reserva espaço mesmo vazia, evita "pulo" de layout */
    font-size: 13px;
    font-weight:bold;
    margin-top: -4px;
  }
  .status-msg.ok{ color:#2f6b2f; }   /* verde = sucesso */
  .status-msg.err{ color:#8a2e2e; } /* vermelho = erro */

  /* rótulo "STEVE" abaixo do personagem */
  .avatar-label{
    text-align:center;
    margin-top: -6px;
    letter-spacing: 2px;
    color:#5a3d1e;
    font-weight:bold;
  }

  /* =========================================================
     CARTÃO DE LOGIN (formulário estilo baú/madeira do Minecraft)
     ========================================================= */
  .card-wrap{
    width: 480px;
    max-width: 92vw; /* nunca ultrapassa a largura da tela em telas pequenas */
    margin: 30px auto 60px;
    padding: 10px; /* essa "moldura" externa marrom escura simula a borda dupla do print */
    background: linear-gradient(180deg,#5a3d1e,#3d2a15);
    border-radius: 4px;
  }
  .card{
    background:#8B5A2B; /* marrom "tábua de madeira" */
    border: 6px solid #6b4020;
    padding: 26px 30px 30px;
  }
  .card h1{
    text-align:center;
    color:#2b1c0d;
    font-size:28px;
    letter-spacing:3px;
    margin: 0 0 20px;
  }

  /* cada linha do formulário: ícone + campo de texto lado a lado */
  .field{
    display:flex;
    align-items:stretch; /* ícone e input ficam com a mesma altura */
    gap:10px;
    margin-bottom:14px;
  }
  .icon{
    width:42px; height:42px;
    flex-shrink:0; /* não deixa o ícone encolher se faltar espaço */
    background:#6b4020;
    border:2px solid #3d2a15;
    display:flex; align-items:center; justify-content:center;
  }
  /* "quadradinho" amarelo dentro do ícone de e-mail */
  .icon.email span{ width:16px;height:16px;background:#f2d675; }
  /* forma de cadeado simplificado dentro do ícone de senha, via clip-path */
  .icon.pass span{ width:16px;height:18px;background:#c98b52; clip-path: polygon(20% 0,80% 0,80% 30%,100% 30%,100% 100%,0 100%,0 30%,20% 30%); }

  .field input{
    flex:1; /* input ocupa todo o espaço restante da linha */
    font-family:inherit;
    font-size:15px;
    padding: 0 12px;
    background:#EDE7D3;
    border:2px solid #3d2a15;
    color:#4a3d28;
  }
  .field input::placeholder{ color:#8b8265; }

  /* linha com "lembrar de mim" à esquerda e "esqueci a senha" à direita */
  .row-between{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:#2f5c2f;
    margin-bottom:16px;
  }
  .remember{ display:flex; align-items:center; gap:8px; color:#2b1c0d; }
  .remember input{ width:16px;height:16px; accent-color:#2f5c2f; }
  .forgot{ font-style:italic; color:#3d6b3d; text-decoration:none; }

  .login-btn{
    width:100%;
    padding:14px;
    font-family:inherit;
    font-size:17px;
    font-weight:bold;
    letter-spacing:2px;
    color:#fff;
    background: linear-gradient(180deg,#6f9a58,#4c7a3c); /* verde estilo botão do Minecraft */
    border: 2px solid #33502a;
    cursor:pointer;
  }
  .login-btn:hover{ filter:brightness(1.08); } /* clareia levemente ao passar o mouse */

  /* tremor do cartão inteiro quando o login falha (feedback visual de erro) */
  .card.shake{ animation: card-shake 0.4s; }
  @keyframes card-shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(8px); }
    60%{ transform: translateX(-5px); }
    80%{ transform: translateX(5px); }
  }
</style>
</head>
<body>

<!-- decoração de fundo: blocos de grama nos cantos e um bloco de terra solto -->
<div class="grass left"></div>
<div class="grass right"></div>
<div class="dirt-block"></div>

<!-- pontinhos brancos espalhados pelo céu (posições fixas, como no print original) -->
<div class="pixel" style="top:150px;left:248px;"></div>
<div class="pixel" style="top:75px;left:965px;"></div>
<div class="pixel" style="top:107px;left:1128px;"></div>
<div class="pixel" style="top:183px;left:1226px;"></div>

<!-- ===== cena de mineração ===== -->
<div class="scene">

  <!-- personagem montado em "blocos": cabeça, corpo, pernas e o braço com a picareta -->
  <div class="character">
    <div class="char-head"></div>
    <div class="char-body"></div>
    <div class="char-legs"><div></div><div></div></div>
    <div class="arm" id="arm">
      <div class="pickaxe" id="pickaxe">
        <div class="pick-handle"></div>
        <div class="pick-head" id="pickHead"></div>
      </div>
    </div>
  </div>

  <!-- bloco de diamante sendo minerado; a div .crack recebe as classes stage-1/2/3 via JS -->
  <div class="diamond-block shaking" id="block">
    <div class="crack" id="crack"></div>
  </div>

</div>

<div class="avatar-label">STEVE</div>

<!-- aqui aparece a mensagem de sucesso/erro depois que o formulário é enviado -->
<div class="status-msg" id="statusMsg"></div>

<!-- ===== formulário de login ===== -->
<div class="card-wrap">
  <div class="card" id="card">
    <h1>USER LOGIN</h1>

    <form id="loginForm">
      <div class="field">
        <div class="icon email"><span></span></div>
        <input type="email" id="email" placeholder="Email ID" required>
      </div>
      <div class="field">
        <div class="icon pass"><span></span></div>
        <input type="password" id="password" placeholder="Password" required>
      </div>
      <div class="row-between">
        <label class="remember"><input type="checkbox"> Remember me</label>
        <a class="forgot" href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="login-btn">LOGIN</button>
    </form>
  </div>
</div>

<script>
  // ===== referências aos elementos que serão manipulados pelo JS =====
  const block     = document.getElementById('block');      // bloco de diamante
  const crack     = document.getElementById('crack');       // camada de rachaduras sobre o bloco
  const arm       = document.getElementById('arm');         // braço do personagem
  const pickHead  = document.getElementById('pickHead');    // cabeça de ferro da picareta
  const card      = document.getElementById('card');        // cartão do formulário (para o "shake")
  const statusMsg = document.getElementById('statusMsg');   // texto de status (sucesso/erro)
  const scene     = document.querySelector('.scene');       // container que serve de referência de posição

  let stage = 0;          // estágio atual da rachadura (0 a 3, depois reinicia)
  let idleTimer = null;   // guarda o setInterval do "loop de mineração" para poder pausá-lo
  let resolved = false;   // true assim que o login já deu certo ou errado (trava a animação de mineração)

  // Fica alternando os estágios de rachadura do bloco a cada 900ms,
  // só para dar a sensação de "mineração em progresso" (efeito estético, contínuo).
  function loopMining(){
    idleTimer = setInterval(() => {
      if(resolved) return; // se já houve resultado do login, não mexe mais no bloco
      stage = (stage % 3) + 1; // vai de 1 -> 2 -> 3 -> 1 -> 2...
      crack.className = 'crack stage-' + stage;
    }, 900);
  }
  loopMining(); // inicia o loop assim que a página carrega

  // Cria e anima os "cacos" do bloco de diamante voando para os lados (usado no sucesso do login)
  function spawnFragments(){
    const rect = block.getBoundingClientRect();       // posição real do bloco na tela
    const sceneRect = scene.getBoundingClientRect();   // posição do container-pai (referência)
    const cx = rect.left - sceneRect.left + rect.width/2;  // centro X do bloco, relativo à cena
    const cy = rect.top - sceneRect.top + rect.height/2;   // centro Y do bloco, relativo à cena

    for(let i=0;i<10;i++){
      const f = document.createElement('div'); // cria um novo "caco" na hora
      f.className = 'frag';
      const angle = Math.random()*Math.PI*2;      // direção aleatória (em radianos, 360°)
      const dist  = 40 + Math.random()*40;        // distância aleatória que o caco vai percorrer
      f.style.setProperty('--fx', Math.cos(angle)*dist + 'px'); // usado no @keyframes frag-fly
      f.style.setProperty('--fy', Math.sin(angle)*dist + 'px');
      f.style.left = cx + 'px';
      f.style.top = cy + 'px';
      scene.appendChild(f);
      requestAnimationFrame(()=> f.classList.add('fly')); // dispara a animação no próximo "frame"
      setTimeout(()=> f.remove(), 700); // remove o elemento do DOM depois que a animação termina
    }
  }

  // Mesma lógica de spawnFragments, mas para os estilhaços da picareta (usado na falha do login)
  function spawnPickShards(){
    const rect = pickHead.getBoundingClientRect();
    const sceneRect = scene.getBoundingClientRect();
    const cx = rect.left - sceneRect.left + rect.width/2;
    const cy = rect.top - sceneRect.top + rect.height/2;

    for(let i=0;i<6;i++){
      const s = document.createElement('div');
      s.className = 'pick-shard';
      const dx = (Math.random()-0.5) * 60; // estilhaços voam mais para os lados do que para cima/baixo
      s.style.setProperty('--dx', dx + 'px');
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      scene.appendChild(s);
      requestAnimationFrame(()=> s.classList.add('fly'));
      setTimeout(()=> s.remove(), 700);
    }
  }

  // Executado quando o login é validado com SUCESSO
  function onSuccess(){
    resolved = true;
    clearInterval(idleTimer);           // para o loop de rachaduras automáticas
    block.classList.remove('shaking');  // bloco para de tremer
    spawnFragments();                   // solta os cacos do bloco
    setTimeout(()=> block.classList.add('broken'), 80); // pequeno delay para o bloco sumir junto com os cacos
    arm.classList.add('arm-idle');      // braço para de balançar (tarefa concluída)
    statusMsg.textContent = '✓ Bloco quebrado! Login realizado com sucesso.';
    statusMsg.className = 'status-msg ok';
  }

  // Executado quando o login FALHA
  function onFail(){
    resolved = true;
    clearInterval(idleTimer);
    arm.classList.add('arm-idle');      // braço para (a picareta quebrou, não dá mais para minerar)
    spawnPickShards();                  // solta os estilhaços da picareta
    pickHead.classList.add('broken');   // esconde a cabeça original da picareta
    card.classList.add('shake');        // o formulário treme, indicando erro
    setTimeout(()=> card.classList.remove('shake'), 420); // remove a classe após a animação acabar
    statusMsg.textContent = '✕ Picareta quebrou! Login falhou, tente novamente.';
    statusMsg.className = 'status-msg err';
  }

  // Volta tudo ao estado inicial (usado quando o usuário tenta logar de novo após um resultado)
  function resetScene(){
    resolved = false;
    stage = 0;
    crack.className = 'crack';           // remove as rachaduras
    block.classList.remove('broken');
    block.classList.add('shaking');      // bloco volta a tremer
    pickHead.classList.remove('broken'); // picareta volta a aparecer inteira
    arm.classList.remove('arm-idle');    // braço volta a balançar
    statusMsg.textContent = '';
    loopMining();                        // reinicia o loop de mineração
  }

  // ===== evento principal: quando o formulário é enviado =====
  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault(); // impede o recarregamento padrão da página ao enviar o formulário

    if(resolved) resetScene(); // se já tinha um resultado anterior, reseta a cena antes de tentar de novo

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    // Regra de validação simples, só para fins de demonstração:
    // considera "sucesso" se o e-mail tiver "@" e a senha tiver 4+ caracteres.
    // (troque essa lógica por uma verificação real de usuário/senha quando for usar de verdade)
    const success = email.includes('@') && password.length >= 4;

    // pequeno atraso antes de mostrar o resultado, só para dar um "suspense" de meio segundo
    setTimeout(() => {
      if(success){ onSuccess(); } else { onFail(); }
    }, 250);
  });
</script>

</body>
</html>
