
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendário de Tarefas</title>

  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #243047;
      background: #f5f7fb;
    }

    * { box-sizing: border-box; }

    body { margin: 0; padding: 24px; }

    .app {
      max-width: 1100px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 6px 24px #15244312;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 { font-size: 24px; }
    h2 { font-size: 19px; text-transform: capitalize; }

    button {
      cursor: pointer;
      padding: 9px 14px;
      border: 1px solid #dbe1eb;
      border-radius: 8px;
      background: white;
      color: inherit;
    }

    button:hover { filter: brightness(.95); }

    .primary {
      background: #4263c7;
      color: white;
      border-color: #4263c7;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid #e0e5ee;
      border-radius: 10px;
      overflow: hidden;
    }

    .weekday {
      padding: 14px 4px;
      text-align: center;
      background: #eef2f8;
      font-weight: 600;
      font-size: 13px;
    }

    .day {
      min-width: 0;
      min-height: 115px;
      padding: 7px;
      border-top: 1px solid #e0e5ee;
      border-right: 1px solid #e0e5ee;
      cursor: pointer;
    }

    .day:nth-child(7n) { border-right: 0; }
    .day:hover { background: #f7f9fd; }
    .outside { opacity: .35; }

    .number {
      display: inline-flex;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .today .number {
      background: #4263c7;
      color: white;
      font-weight: bold;
    }

    .event {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 5px;
      border: none;
      border-radius: 5px;
      text-align: left;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #253047;
    }

    .trabalho { background: #dbe8ff; }
    .pessoal { background: #d8f4e4; }
    .urgente { background: #ffdedb; }
    .geral { background: #ece9f4; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0009;
      padding: 16px;
    }

    .hidden { display: none; }

    .modal {
      background: white;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 14px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    input, textarea, select {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #dbe1eb;
      border-radius: 7px;
      font: inherit;
    }

    .times { display: flex; gap: 12px; }
    .times label { flex: 1; min-width: 0; }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    #error { color: #bd3434; font-size: 13px; }
    #delete { color: #bd3434; margin-right: auto; }

    @media (max-width: 600px) {
      body { padding: 8px; }
      .app { padding: 10px; }
      .day { min-height: 75px; padding: 3px; }
      .event { font-size: 10px; padding: 3px; }
      .number { width: 23px; height: 23px; }
      h2 { font-size: 16px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="toolbar">
      <h1>Calendário de tarefas</h1>
      <button class="primary" id="add">+ Nova tarefa</button>
    </div>

    <div class="toolbar">
      <div class="navigation">
        <button id="prev" aria-label="Mês anterior">‹</button>
        <h2 id="month"></h2>
        <button id="next" aria-label="Mês seguinte">›</button>
      </div>
      <button id="today">Hoje</button>
    </div>

    <section class="calendar" id="calendar"
             aria-label="Calendário mensal">
    </section>
  </main>

  <!-- Modal de criação e edição -->
  <div class="overlay hidden" id="overlay">
    <div class="modal" role="dialog"
         aria-modal="true" aria-labelledby="formTitle">
      <h2 id="formTitle">Nova tarefa</h2>

      <form id="taskForm">
        <label>Data
          <input type="date" id="date" required>
        </label>

        <label>Título
          <input type="text" id="title"
                 maxlength="90" required>
        </label>

        <label>Descrição
          <textarea id="description" rows="3"
                    maxlength="500" required></textarea>
        </label>

        <div class="times">
          <label>Início
            <input type="time" id="start" required>
          </label>
          <label>Fim
            <input type="time" id="end" required>
          </label>
        </div>

        <label>Categoria
          <select id="category">
            <option value="geral">Geral</option>
            <option value="trabalho">Trabalho</option>
            <option value="pessoal">Pessoal</option>
            <option value="urgente">Urgente</option>
          </select>
        </label>

        <p id="error" role="alert"></p>

        <div class="actions">
          <button type="button" id="delete"
                  class="hidden">Eliminar</button>
          <button type="button" id="cancel">Cancelar</button>
          <button type="submit" class="primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Elementos da interface
    const $ = id => document.getElementById(id);
    const STORAGE_KEY = "gestor-tarefas-eventos-v1";

    // Recuperar dados do navegador
    let events = [];
    try {
      const stored = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );
      events = Array.isArray(stored) ? stored : [];
    } catch (error) {
      console.warn("Dados guardados inválidos.", error);
    }

    let currentDate = new Date();
    let editingId = null;

    const pad = n => String(n).padStart(2, "0");

    // Datas locais, evitando problemas de fuso horário
    function formatDate(date) {
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-");
    }

    function saveEvents() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(events)
        );
        return true;
      } catch (error) {
        $("error").textContent =
          "Não foi possível guardar os dados.";
        return false;
      }
    }

    // Construir a grelha mensal
    function renderCalendar() {
      const calendar = $("calendar");
      calendar.replaceChildren();

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      $("month").textContent =
        new Intl.DateTimeFormat("pt-PT", {
          month: "long",
          year: "numeric"
        }).format(currentDate);

      ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"]
        .forEach(name => {
          const heading = document.createElement("div");
          heading.className = "weekday";
          heading.textContent = name;
          calendar.append(heading);
        });

      const first = new Date(year, month, 1);
      const offset = (first.getDay() + 6) % 7;
      const daysInMonth =
        new Date(year, month + 1, 0).getDate();

      const totalCells =
        Math.ceil((offset + daysInMonth) / 7) * 7;

      for (let i = 0; i < totalCells; i++) {
        const date = new Date(year, month, 1 - offset + i);
        const dateString = formatDate(date);

        const cell = document.createElement("div");
        cell.className = "day";
        cell.tabIndex = 0;
        cell.setAttribute("role", "button");
        cell.setAttribute("aria-label",
          new Intl.DateTimeFormat("pt-PT", {
            dateStyle: "full"
          }).format(date)
        );

        if (date.getMonth() !== month)
          cell.classList.add("outside");

        if (dateString === formatDate(new Date()))
          cell.classList.add("today");

        const number = document.createElement("span");
        number.className = "number";
        number.textContent = date.getDate();
        cell.append(number);

        // Mostrar eventos ordenados por hora
        events
          .filter(event => event.date === dateString)
          .sort((a, b) => a.start.localeCompare(b.start))
          .forEach(event => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "event " +
              (["trabalho", "pessoal", "urgente"]
                .includes(event.category)
                ? event.category : "geral");

            // textContent evita injeção de HTML
            button.textContent =
              `${event.start} ${event.title}`;

            button.title =
              `${event.title}\n${event.start}–${event.end}` +
              `\n${event.description}`;

            button.addEventListener("click", e => {
              e.stopPropagation();
              openForm(dateString, event.id);
            });

            cell.append(button);
          });

        cell.addEventListener("click", () =>
          openForm(dateString)
        );

        cell.addEventListener("keydown", e => {
          if (e.target === cell &&
              (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            openForm(dateString);
          }
        });

        calendar.append(cell);
      }
    }

    // Abrir formulário para criar ou editar
    function openForm(date, id = null) {
      editingId = id;
      const event = events.find(item => item.id === id);

      $("taskForm").reset();
      $("error").textContent = "";

      $("date").value = event?.date || date;
      $("title").value = event?.title || "";
      $("description").value = event?.description || "";
      $("start").value = event?.start || "09:00";
      $("end").value = event?.end || "10:00";
      $("category").value = event?.category || "geral";

      $("formTitle").textContent =
        event ? "Editar tarefa" : "Nova tarefa";

      $("delete").classList.toggle("hidden", !event);
      $("overlay").classList.remove("hidden");
      $("title").focus();
    }

    function closeForm() {
      $("overlay").classList.add("hidden");
      editingId = null;
    }

    // Guardar criação ou alterações
    $("taskForm").addEventListener("submit", e => {
      e.preventDefault();

      const data = {
        date: $("date").value,
        title: $("title").value.trim(),
        description: $("description").value.trim(),
        start: $("start").value,
        end: $("end").value,
        category: $("category").value
      };

      if (!data.date || !data.title ||
          !data.description || !data.start || !data.end) {
        $("error").textContent =
          "Preenche todos os campos obrigatórios.";
        return;
      }

      if (data.end <= data.start) {
        $("error").textContent =
          "A hora de fim deve ser posterior ao início.";
        return;
      }

      const previous = events;

      if (editingId) {
        events = events.map(event =>
          event.id === editingId
            ? { ...event, ...data }
            : event
        );
      } else {
        events = [
          ...events,
          { id: crypto.randomUUID(), ...data }
        ];
      }

      if (!saveEvents()) {
        events = previous;
        return;
      }

      const [year, month] = data.date.split("-").map(Number);
      currentDate = new Date(year, month - 1, 1);

      closeForm();
      renderCalendar();
    });

    // Eliminar evento selecionado
    $("delete").addEventListener("click", () => {
      if (!editingId || !confirm("Eliminar esta tarefa?"))
        return;

      const previous = events;
      events = events.filter(e => e.id !== editingId);

      if (!saveEvents()) {
        events = previous;
        return;
      }

      closeForm();
      renderCalendar();
    });

    // Navegação
    $("prev").addEventListener("click", () => {
      currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() - 1, 1
      );
      renderCalendar();
    });

    $("next").addEventListener("click", () => {
      currentDate = new Date(
        currentDate.getFullYear(),
        currentDate.getMonth() + 1, 1
      );
      renderCalendar();
    });

    $("today").addEventListener("click", () => {
      currentDate = new Date();
      renderCalendar();
    });

    $("add").addEventListener("click", () =>
      openForm(formatDate(new Date()))
    );

    $("cancel").addEventListener("click", closeForm);

    $("overlay").addEventListener("click", e => {
      if (e.target === $("overlay")) closeForm();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeForm();
    });

    // Inicialização
    renderCalendar();
  </script>
</body>
</html>
