<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarefinha — organize seu dia, bloco por bloco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #EFEBDC;
    --panel: #E4E0CB;
    --sage: #93AA82;
    --sage-dark: #6F8A5E;
    --ink: #3A3324;
    --wood: #8B5A2B;
    --wood-dark: #5C3A1E;
    --wood-light: #C2A15A;
    --plum: #6E4A66;
    --leaf: #5C8A4C;
    --gold: #D4A843;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
    line-height: 1.5;
  }

  header{
    background: var(--sage);
    padding: 28px 20px 40px;
    text-align: center;
    border-bottom: 6px solid var(--sage-dark);
  }

  .logo{
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    color: var(--ink);
    letter-spacing: 1px;
    margin: 0 0 10px;
  }

  header p{
    max-width: 440px;
    margin: 0 auto;
    font-size: 16px;
    color: #2E2A1C;
  }

  main{
    max-width: 620px;
    margin: -22px auto 60px;
    padding: 0 18px;
  }

  .progress-panel{
    background: var(--panel);
    border: 3px solid var(--wood-dark);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
  }

  .progress-panel .label{
    display:flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
  }

  .xp-bar{
    display:flex;
    gap:3px;
    height: 16px;
  }

  .xp-seg{
    flex:1;
    background: #cfc9ad;
    border: 1px solid var(--wood-dark);
  }

  .xp-seg.filled{ background: var(--gold); }

  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .cat-btn{
    font-family: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border: 2px solid var(--wood-dark);
    background: var(--panel);
    color: var(--ink);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .cat-btn.active{
    background: var(--sage);
    border-color: var(--sage-dark);
  }

  .add-row{
    display:flex;
    gap:8px;
    margin-bottom: 22px;
  }

  .add-row input, .add-row select{
    font-family: inherit;
    font-size: 15px;
    padding: 10px;
    border: 2px solid var(--wood-dark);
    border-radius: var(--radius);
    background: #fff;
  }

  .add-row input{ flex:1; min-width: 120px; }

  .add-row button{
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    background: var(--plum);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 0 16px;
    cursor: pointer;
  }
  .add-row button:hover{ background: #5a3b53; }

  .task-list{ display:flex; flex-direction:column; gap:10px; }

  .item-frame{
    display:flex;
    align-items:center;
    gap:12px;
    padding: 12px 14px;
    border: 4px solid var(--wood-dark);
    border-radius: var(--radius);
    background:
      repeating-linear-gradient(90deg, var(--wood) 0 10px, #7d4e22 10px 20px);
    box-shadow: inset 0 0 0 3px var(--wood-light);
    color: #fff8ea;
  }

  .item-frame.done{
    opacity: 0.55;
  }

  .item-frame.done .task-text{
    text-decoration: line-through;
  }

  .check{
    flex-shrink:0;
    width: 26px;
    height: 26px;
    border: 2px solid #fff8ea;
    border-radius: 3px;
    background: rgba(0,0,0,0.2);
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 15px;
  }

  .item-frame.done .check{ background: var(--gold); color:var(--wood-dark); }

  .task-text{ flex:1; font-size: 15px; }

  .task-cat{ font-size: 11px; opacity: 0.85; }

  .remove-btn{
    background:none;
    border:none;
    color:#fff8ea;
    font-size: 18px;
    cursor:pointer;
    opacity: 0.7;
  }
  .remove-btn:hover{ opacity: 1; }

  .empty-msg{
    text-align:center;
    padding: 30px 10px;
    color: #6b6350;
    font-size: 15px;
  }

  .focus-btn{
    display:block;
    margin: 26px auto 0;
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: var(--sage-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 14px 20px;
    cursor: pointer;
  }
  .focus-btn:hover{ background: #5c7a4c; }

  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(58,51,36,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  .overlay.hidden{ display:none; }

  .focus-card{
    background: var(--panel);
    border: 4px solid var(--plum);
    border-radius: var(--radius);
    padding: 32px 26px;
    max-width: 380px;
    width: 100%;
    text-align:center;
  }

  .focus-card .eyebrow{
    font-size: 13px;
    color: var(--plum);
    margin-bottom: 6px;
  }

  .focus-card .focus-task{
    font-size: 22px;
    margin: 10px 0 24px;
  }

  .focus-actions{
    display:flex;
    gap:10px;
    justify-content:center;
  }

  .focus-actions button{
    font-family: inherit;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: var(--radius);
    border: 2px solid var(--wood-dark);
    cursor: pointer;
  }

  .btn-done{ background: var(--leaf); color:#fff; border-color: #3f6132; }
  .btn-skip{ background: var(--panel); color: var(--ink); }
  .btn-close{ background:none; border:none; color: var(--plum); margin-top: 18px; font-size: 13px; text-decoration: underline; cursor:pointer; }

  @media (prefers-reduced-motion: no-preference){
    .item-frame{ transition: opacity 0.2s ease; }
  }
</style>
</head>
<body>

<header>
  <p class="logo">🖼️ TAREFINHA</p>
  <p>Cada tarefa é um quadrinho no seu dia. Um bloco de cada vez — sem pressa, sem sobrecarga.</p>
</header>

<main>

  <div class="progress-panel">
    <div class="label">
      <span id="progress-text">0 de 0 tarefas concluídas hoje</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="xp-bar" id="xp-bar"></div>
  </div>

  <div class="toolbar" id="cat-filters">
    <button class="cat-btn active" data-cat="todas">Todas</button>
    <button class="cat-btn" data-cat="Casa">🏠 Casa</button>
    <button class="cat-btn" data-cat="Autocuidado">🌸 Autocuidado</button>
    <button class="cat-btn" data-cat="Plantas & Bichos">🪴 Plantas & Bichos</button>
    <button class="cat-btn" data-cat="Outros">📦 Outros</button>
  </div>

  <form class="add-row" id="add-form">
    <input type="text" id="task-input" placeholder="Nova tarefa, ex: regar as plantas" required>
    <select id="cat-input">
      <option value="Casa">🏠 Casa</option>
      <option value="Autocuidado">🌸 Autocuidado</option>
      <option value="Plantas & Bichos">🪴 Plantas & Bichos</option>
      <option value="Outros">📦 Outros</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <div class="task-list" id="task-list"></div>

  <button class="focus-btn" id="focus-btn">▶ Modo foco</button>

</main>

<div class="overlay hidden" id="overlay">
  <div class="focus-card">
    <p class="eyebrow">Modo foco — só isso agora</p>
    <p class="focus-task" id="focus-task-text">Tudo feito por aqui 🎉</p>
    <div class="focus-actions" id="focus-actions">
      <button class="btn-done" id="focus-done">Concluí</button>
      <button class="btn-skip" id="focus-skip">Deixar para depois</button>
    </div>
    <button class="btn-close" id="focus-close">Fechar</button>
  </div>
</div>

<script>
  const CAT_ICON = {
    "Casa": "🏠",
    "Autocuidado": "🌸",
    "Plantas & Bichos": "🪴",
    "Outros": "📦"
  };

  let tasks = [
    { id: 1, text: "Regar as plantas", cat: "Plantas & Bichos", done: false },
    { id: 2, text: "Alimentar o cachorro", cat: "Plantas & Bichos", done: false },
    { id: 3, text: "Passar aspirador atrás do sofá", cat: "Casa", done: false },
    { id: 4, text: "Beber um copo de água", cat: "Autocuidado", done: false },
    { id: 5, text: "Noite de jogos em família", cat: "Outros", done: false }
  ];

  let activeCat = "todas";
  let nextId = 6;

  const listEl = document.getElementById("task-list");
  const xpBar = document.getElementById("xp-bar");
  const progressText = document.getElementById("progress-text");
  const progressPct = document.getElementById("progress-pct");
  const overlay = document.getElementById("overlay");

  function render(){
    const visible = activeCat === "todas" ? tasks : tasks.filter(t => t.cat === activeCat);

    listEl.innerHTML = "";
    if(visible.length === 0){
      listEl.innerHTML = '<p class="empty-msg">Nenhuma tarefa aqui ainda. Adicione uma acima 🌱</p>';
    }

    visible.forEach(t => {
      const row = document.createElement("div");
      row.className = "item-frame" + (t.done ? " done" : "");
      row.innerHTML = `
        <div class="check" data-id="${t.id}">${t.done ? "✓" : ""}</div>
        <div style="flex:1">
          <div class="task-text">${t.text}</div>
          <div class="task-cat">${CAT_ICON[t.cat]} ${t.cat}</div>
        </div>
        <button class="remove-btn" data-id="${t.id}" aria-label="Remover tarefa">✕</button>
      `;
      listEl.appendChild(row);
    });

    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const pct = total === 0 ? 0 : Math.round((done/total)*100);

    progressText.textContent = `${done} de ${total} tarefas concluídas hoje`;
    progressPct.textContent = `${pct}%`;

    xpBar.innerHTML = "";
    const segments = 10;
    const filledSegments = Math.round((pct/100) * segments);
    for(let i=0; i<segments; i++){
      const seg = document.createElement("div");
      seg.className = "xp-seg" + (i < filledSegments ? " filled" : "");
      xpBar.appendChild(seg);
    }
  }

  listEl.addEventListener("click", (e) => {
    const checkEl = e.target.closest(".check");
    const removeEl = e.target.closest(".remove-btn");
    if(checkEl){
      const id = Number(checkEl.dataset.id);
      const t = tasks.find(x => x.id === id);
      if(t) t.done = !t.done;
      render();
    }
    if(removeEl){
      const id = Number(removeEl.dataset.id);
      tasks = tasks.filter(x => x.id !== id);
      render();
    }
  });

  document.getElementById("cat-filters").addEventListener("click", (e) => {
    const btn = e.target.closest(".cat-btn");
    if(!btn) return;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeCat = btn.dataset.cat;
    render();
  });

  document.getElementById("add-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("task-input");
    const catInput = document.getElementById("cat-input");
    const text = input.value.trim();
    if(!text) return;
    tasks.push({ id: nextId++, text, cat: catInput.value, done: false });
    input.value = "";
    render();
  });

  const focusTaskText = document.getElementById("focus-task-text");
  const focusActions = document.getElementById("focus-actions");

  function currentFocusTask(){
    return tasks.find(t => !t.done);
  }

  function renderFocus(){
    const t = currentFocusTask();
    if(!t){
      focusTaskText.textContent = "Tudo feito por aqui 🎉";
      focusActions.style.display = "none";
    } else {
      focusTaskText.textContent = `${CAT_ICON[t.cat]} ${t.text}`;
      focusActions.style.display = "flex";
    }
  }

  document.getElementById("focus-btn").addEventListener("click", () => {
    renderFocus();
    overlay.classList.remove("hidden");
  });

  document.getElementById("focus-close").addEventListener("click", () => {
    overlay.classList.add("hidden");
    render();
  });

  document.getElementById("focus-done").addEventListener("click", () => {
    const t = currentFocusTask();
    if(t) t.done = true;
    renderFocus();
  });

  document.getElementById("focus-skip").addEventListener("click", () => {
    const t = currentFocusTask();
    if(t){
      tasks = tasks.filter(x => x.id !== t.id);
      tasks.push(t);
    }
    renderFocus();
  });

  render();
</script>

</body>
</html>
