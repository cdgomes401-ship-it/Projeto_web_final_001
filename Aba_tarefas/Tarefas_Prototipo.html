<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarefinha — organize seu dia, bloco por bloco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Tarefas_Prototipo.css">
<script src="tarefas.js" defer></script>
</head>
<body>

<header class="topbar">
  <p class="logo"><span class="grass-icon">▰</span> TAREFINHA</p>
  <p>Cada tarefa é um quadrinho no seu dia. Um bloco de cada vez — sem pressa, sem sobrecarga.</p>
   <nav>
        <a href="#home">Home</a>
        <a href="#dicas">Dicas</a>
        <a href="#sobreNos">Sobre nós</a>
    </nav>
</header>

<main style="display: flex;">  
  <div style="box-sizing: border-box; padding: 2rem; ">
    <nav style=" color: #dfead7;
    font-size: 13px;
    text-decoration: none; gap: 30px ">
        <a href= #task_input>Adicionar tarefa</a>
        <a href="calendario.html">Calendário</a>
    </nav></div>
<div>
  <div class="progress-panel">
    <div class="label">
      <span id="progress-text">0 de 0 tarefas concluídas hoje</span>
      <span id="progress-pct">0%</span>
    </div>
    <div class="xp-bar" id="xp-bar"></div>
  </div>

  <div class="toolbar" id="cat-filters" aria-label="Filtrar tarefas por categoria"></div>

  <form class="add-row" id="add-form">
    <input type="text" id="task-input" placeholder="Nova tarefa, ex: regar as plantas" required>
    <select id="cat-input" aria-label="Categoria da tarefa" required></select>
    <select id="priority-input" aria-label="Prioridade da tarefa" required>
      <option value="" selected disabled>Prioridade</option>
      <option value="1">1 - Muito alta</option>
      <option value="2">2 - Alta</option>
      <option value="3">3 - Média</option>
      <option value="4">4 - Normal</option>
    </select>
    <select id="energy-input" aria-label="Nível de energia da tarefa" required>
      <option value="" selected disabled>Energia</option>
      <option value="0">0 - Muito baixa</option>
      <option value="1">1 - Baixa</option>
      <option value="2">2 - Média</option>
      <option value="3">3 - Alta</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <div class="task-list" id="task-list"></div>

  <button class="focus-btn" id="focus-btn">▶ Modo foco</button>
</div>
</main>

<dialog id="timer-dialog" aria-labelledby="timer-title">
  <div class="timer-card">
    <button type="button" class="timer-close" id="timer-close" aria-label="Fechar timer">&times;</button>
    <h2 id="timer-title">Timer da tarefa</h2>
    <p class="timer-task" id="timer-task-name"></p>
    <output id="timer-display" class="timer-display" aria-live="polite">05:00</output>
    <label class="timer-minutes-label" for="timer-minutes">Duração da estimativa (minutos)</label>
    <input id="timer-minutes" type="number" min="1" max="2147483647" value="5" required>
    <p id="timer-error" class="timer-error" role="alert"></p>
    <div class="timer-actions">
      <button type="button" id="timer-start">Iniciar</button>
      <button type="button" id="timer-reset">Reiniciar</button>
      <button type="button" id="timer-save">Guardar estimativa</button>
    </div>
  </div>
</dialog>

<div class="overlay hidden" id="overlay">
  <div class="focus-card">
    <p class="eyebrow">Modo foco — só isso agora</p>
    <p class="focus-task" id="focus-task-text">Tudo feito por aqui 🎉</p>
    <div class="focus-actions" id="focus-actions">
      <button class="btn-done" id="focus-done">Concluí</button>
      <button class="btn-skip" id="focus-skip">Deixar para depois</button>
    </div>
    <button class="btn-close" id="focus-close">Fechar</button>
  </div>
</div>

</body>
</html>
